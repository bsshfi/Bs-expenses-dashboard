<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصاريفي</title>
<meta name="description" content="لوحة عرض مصروفات Bs-Expenses — قراءة فقط">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f3f4f6; --card:#ffffff; --ink:#111827; --sub:#6b7280; --faint:#9ca3af; --line:#e5e7eb;
  --accent:#0f766e; --accent2:#14b8a6; --accentbg:#ccfbf1;
  --up:#c2410c; --upbg:#ffedd5; --down:#15803d; --downbg:#dcfce7; --warnbg:#fef3c7; --warn:#92400e;
  --bar:#d1d5db; --shadow:0 1px 2px rgba(0,0,0,.05),0 1px 8px rgba(0,0,0,.04); --onaccent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d10; --card:#16191e; --ink:#f3f4f6; --sub:#9ca3af; --faint:#6b7280; --line:#262a31;
    --accent:#2dd4bf; --accent2:#5eead4; --accentbg:#0f2f2c;
    --up:#fb923c; --upbg:#3a2412; --down:#4ade80; --downbg:#12301d; --warnbg:#3a2e10; --warn:#fcd34d;
    --bar:#2f343c; --shadow:none; --onaccent:#0b0d10;
  }
}
:root[data-theme="dark"]{
    --bg:#0b0d10; --card:#16191e; --ink:#f3f4f6; --sub:#9ca3af; --faint:#6b7280; --line:#262a31;
    --accent:#2dd4bf; --accent2:#5eead4; --accentbg:#0f2f2c;
    --up:#fb923c; --upbg:#3a2412; --down:#4ade80; --downbg:#12301d; --warnbg:#3a2e10; --warn:#fcd34d;
    --bar:#2f343c; --shadow:none; --onaccent:#0b0d10;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.45 -apple-system,"SF Arabic","SF Pro Text",system-ui,"Segoe UI",Tahoma,sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 28px);
  max-width:720px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}

/* شريط علوي */
.top{display:flex;align-items:center;gap:10px;padding:8px 16px 12px;margin:0 -16px 6px;position:sticky;top:0;z-index:20;
  background:color-mix(in srgb, var(--bg) 78%, transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}
.top .logo{width:30px;height:30px;border-radius:8px;flex-shrink:0}
#refresh{display:none}
.top{gap:8px}
.top h1{font-size:20px!important;overflow:visible!important;text-overflow:clip!important;flex:1 0 auto!important}
.top .month{font-size:14px;padding:7px 9px}
.top .iconbtn{width:38px;height:38px}
.fresh.loading i{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.fresh{font-size:12px;color:var(--faint);margin:-2px 2px 10px;display:flex;align-items:center;gap:6px}
.fresh i{width:7px;height:7px;border-radius:50%;background:var(--down);display:inline-block}
.fresh.old i{background:var(--up)}
/* سحب للتحديث */
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;color:var(--sub);font-size:13px;transition:height .2s}
#ptr.go{transition:none}
/* إخفاء المبالغ */
body.private #app .num{filter:blur(7px);transition:filter .2s}
body.private #app .t.num,body.private #app .axis{filter:none}
.top h1{font-size:22px;margin:0;flex:1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#month:empty{display:none}
.month{appearance:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0;font-weight:600;box-shadow:var(--shadow)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.iconbtn svg{width:20px;height:20px;stroke:var(--ink)}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* بطاقات */
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;color:var(--sub);font-weight:600;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
.hero .label{color:var(--sub);font-size:14px}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0 6px}
.hero .big small{font-size:16px;font-weight:600;color:var(--sub);margin-inline-start:6px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.pill.up{background:var(--upbg);color:var(--up)} .pill.down{background:var(--downbg);color:var(--down)} .pill.flat{background:var(--line);color:var(--sub)}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;color:var(--sub);font-size:14px}
.hero .meta b{color:var(--ink)}
.hero .mbar{height:7px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden;position:relative}
.hero .mbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hero .mbar b{position:absolute;top:-3px;width:2px;height:13px;background:var(--ink);opacity:.55;border-radius:2px}
.hero .mtxt{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--sub);margin-top:6px}
.d-classic .hero,.d-vivid .hero{color:#fff;background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);position:relative;overflow:hidden;box-shadow:0 14px 34px -14px var(--accent)}
.d-classic .hero:after,.d-vivid .hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.13);left:-90px;top:-120px;pointer-events:none}
.d-classic .hero .label,.d-vivid .hero .label,.d-classic .hero .big small,.d-vivid .hero .big small,.d-classic .hero .meta,.d-vivid .hero .meta,.d-classic .hero .mtxt,.d-vivid .hero .mtxt{color:rgba(255,255,255,.85)}
.d-classic .hero .meta b,.d-vivid .hero .meta b{color:#fff}
.d-classic .hero .pill,.d-vivid .hero .pill{background:rgba(255,255,255,.22)!important;color:#fff!important}
.d-classic .hero .mbar,.d-vivid .hero .mbar{background:rgba(255,255,255,.25)}
.d-classic .hero .mbar i,.d-vivid .hero .mbar i{background:#fff}
.d-classic .hero .mbar b,.d-vivid .hero .mbar b{background:#fff;opacity:.9}
.d-vivid .hero{background:linear-gradient(135deg,#1e3a8a 0%,#2563eb 50%,#06b6d4 100%);box-shadow:0 14px 34px -14px #2563eb}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-width:0}
.kpi .l{color:var(--sub);font-size:13px}
.kpi .v{font-size:21px;font-weight:750;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{color:var(--faint);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.alerts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.alert{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600}

/* أعمدة */
.cols{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.col .b{width:100%;background:var(--bar);border-radius:4px 4px 2px 2px;min-height:2px}
.col.future .b{opacity:.35}
.col.on .b{background:var(--accent)}
.col.today .b{background:var(--accent2)}
.col .t{font-size:10px;color:var(--faint);margin-top:4px;height:13px}
.trend .cols{height:150px;gap:10px}
.trend .col{cursor:pointer}
.trend .col .v{font-size:11px;color:var(--sub);margin-bottom:4px;white-space:nowrap}
.trend .col .t{font-size:12px}
.week .cols{height:110px;gap:8px}
.week .col .t{font-size:12px}

/* قوائم */
.list{display:flex;flex-direction:column}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:2px}
.item .r1{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item .n{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .a{font-weight:700;white-space:nowrap}
.item .r2{display:flex;justify-content:space-between;gap:12px;color:var(--sub);font-size:13px;margin-top:2px}
.track{height:6px;background:var(--line);border-radius:99px;margin-top:7px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}

/* تلميح العمود اليومي */
.dtip{min-height:20px;font-size:13px;color:var(--sub);margin:-4px 0 6px}
.dtip b{color:var(--ink)}
.col.sel .b{outline:2px solid var(--ink);outline-offset:1px}

/* سباق الشهر */
.race svg{display:block;width:100%;height:150px}
.leg{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-top:6px}
.leg i{display:inline-block;width:16px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.race .ahead{font-weight:600}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:2px}

/* دائرة التصنيفات */
.donut{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.donut svg{flex-shrink:0}
.lgd{flex:1;min-width:0;font-size:13px}
.lgd div{display:flex;align-items:center;gap:8px;padding:3px 0}
.lgd i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.lgd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== التصميم 2: ملوّن ===== */
.d-vivid .card,.d-vivid .kpi{border-radius:22px}
.d-vivid .hero .big{font-size:42px}
.d-vivid .kpi .v{color:var(--ink)}
.d-vivid .kpi .l{font-weight:600}

.tabs{display:flex;background:var(--line);border-radius:10px;padding:2px;gap:2px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:4px 10px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.tx .n{font-weight:600}
.tx .item,.cat-row{cursor:pointer}
.tx .item:active{opacity:.6}

/* ملاحظات الشهر */
.ins{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.55}
.ins:first-of-type{border-top:0;padding-top:2px}
.ins .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;flex-shrink:0;background:var(--accentbg)}
.ins b{font-weight:700}

/* أعلى يوم بالأسبوع */
.week .col.max .b{background:#f97316!important}
.week .col .v{font-size:10px;color:var(--sub);margin-bottom:3px;white-space:nowrap;height:13px}

/* نافذة تفاصيل العملية */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet .bk{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--card);border-radius:22px 22px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);transform:translateY(100%);transition:transform .25s ease}
#sheet.on .bk{opacity:1} #sheet.on .pn{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
#sheet .amt{font-size:34px;font-weight:800;text-align:center;margin:4px 0}
#sheet .who{text-align:center;font-weight:700;font-size:18px}
#sheet .cat{text-align:center;margin:6px 0 14px}
#sheet .cat span{display:inline-block;border-radius:99px;padding:3px 12px;font-size:13px;font-weight:700;color:#fff}
#sheet .kv{display:flex;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--line);font-size:15px}
#sheet .kv span:first-child{color:var(--sub)}
#sheet .sim{margin-top:10px;font-size:13px;color:var(--sub);text-align:center}
.empty{color:var(--faint);text-align:center;padding:16px 0;font-size:14px}

.banner{border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:14px;background:var(--upbg);color:var(--up);display:none}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:18px;line-height:1.8}
.foot a{color:var(--sub)}

/* الإعداد */
/* الدخول */
#auth{display:none}
.auth{text-align:center;padding:26px 18px}
.auth .lock{font-size:40px;line-height:1}
.auth h3{margin:10px 0 4px;font-size:20px}
.auth p{color:var(--sub);font-size:14px;margin:0 0 6px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 8px;direction:ltr}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--sub)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
.msg{min-height:22px;font-size:14px;font-weight:600;color:var(--up);margin:6px 0}
.msg.ok{color:var(--down)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:290px;margin:14px auto 6px;direction:ltr}
.pad button{height:64px;width:64px;justify-self:center;border-radius:50%;border:0;background:var(--bg);font-size:26px;font-weight:600;cursor:pointer}
.pad button:active{background:var(--line)}
.pad .ghostk{background:transparent;font-size:15px;color:var(--sub)}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer;margin-top:10px;padding:8px}
.form{text-align:right}
.form label{display:block;font-size:13px;color:var(--sub);margin:14px 0 6px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0}
.paste{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 14px;font-weight:700;color:var(--accent);cursor:pointer;white-space:nowrap}
.hint{color:var(--faint);font-size:12px;margin-top:6px}
.form input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;direction:ltr;text-align:left;font-size:16px}
.form input.pin{letter-spacing:8px;text-align:center;font-size:20px}
.btn{margin-top:16px;width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:var(--onaccent);font-weight:700;font-size:16px;cursor:pointer}

/* التخصيص */
#prefs{display:none}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.opt:first-of-type{border-top:0}
.opt .ol{font-weight:600}
.opt .os{color:var(--faint);font-size:12px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:2px;gap:2px;flex-shrink:0}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
.sec{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.sec .sn{flex:1;font-weight:600}
.sec.off .sn{color:var(--faint);text-decoration:line-through}
.mv{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:13px;color:var(--sub)}
.mv:disabled{opacity:.3}
.tg{appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex-shrink:0;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:right .15s}
.tg:checked{background:var(--accent)}
.tg:checked::after{right:21px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--sub)}
.chip.on{background:var(--accentbg);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);margin-top:10px}
.skeleton .big,.skeleton .v{color:transparent;background:var(--line);border-radius:8px}
</style>
</head>
<body>

<div class="top">
  <img class="logo" src="icon-180.png" alt="">
  <h1>مصاريفي</h1>
  <button id="eye" class="iconbtn" aria-label="إخفاء المبالغ">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
  <select id="month" class="month" aria-label="الشهر"></select>
  <button id="refresh" class="iconbtn" aria-label="تحديث">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <button id="gear" class="iconbtn" aria-label="الإعدادات">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div>

<div id="ptr">↓ اسحب للتحديث</div>
<div id="fresh" class="fresh" style="display:none"></div>
<div id="banner" class="banner"></div>

<!-- الدخول بالرقم السري -->
<div id="auth" class="card auth"></div>

<!-- التخصيص -->
<div id="prefs">
  <section class="card">
    <h2>🎨 المظهر</h2>
    <div class="opt"><div><div class="ol">الوضع</div></div><div class="seg" id="pTheme"></div></div>
    <div class="opt" style="display:block"><div class="ol" style="margin-bottom:10px">اللون</div><div class="swatches" id="pAccent"></div></div>
    <div class="opt"><div><div class="ol">إخفاء المبالغ عند الفتح</div><div class="os">تظهر بالضغط على 👁 فوق</div></div><input type="checkbox" class="tg" id="pPriv"></div>
    <div class="opt"><div><div class="ol">الهللات</div><div class="os">عرض المبالغ بالكسور (12.50) أو مقرّبة (13)</div></div><input type="checkbox" class="tg" id="pDec"></div>

/* ---------- الاتصال بالسكربت ---------- */
/* Google أحيانًا يرد ردّ مؤقت غلط (UsePost / Server busy / قطع اتصال) — نعيد المحاولة بهدوء قبل ما نعرض خطأ */
const sleep = ms => new Promise(r => setTimeout(r, ms));
function transient(r){
  if(!r) return true;
  if(r.error === 'UsePost' || r.error === 'UnknownAction') return true;
  if(r.success === false && /busy|retry|timeout|exceeded|service/i.test(String(r.message || ''))) return true;
  return false;
}
async function api(action, payload, tries){
  tries = tries || (action === 'dash_login' || action === 'dash_setup' || action === 'dash_change' ? 2 : 4);
  let last = null, lastErr = null;
  for(let i = 0; i < tries; i++){
    if(i) await sleep(900 * i + Math.random() * 400);
    try {
      const res = await fetch(API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 't=' + Date.now() + '_' + i,
        { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, payload || {})), cache: 'no-store', redirect: 'follow' });
      const txt = await res.text();
      let r; try { r = JSON.parse(txt); } catch(e){ r = { ok: false, error: 'BadResponse' }; }
      if(r && r.success === false && !r.error) r.error = String(r.message || 'ScriptError'); // ردود doPost القديمة
      last = r;
      if(r.error === 'BadResponse' || transient(r)) continue;
      return r;
    } catch(e){ lastErr = e; }
  }
  if(last) return last;
  throw lastErr || new Error('network');
}
function session(){ return LS.get('bsx:session') || ''; }
function apiReady(){ return /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL); }
function clearData(){
  try { Object.keys(localStorage).filter(k => k.indexOf('bsx:data:') === 0).forEach(k => localStorage.removeItem(k)); } catch(e){}
  state.data = null; $('app').innerHTML = ''; $('updated').textContent = ''; $('month').innerHTML = '';
}
async function logout(){
  const s = session();
  LS.del('bsx:session'); clearData();
  try { if(s) await api('dash_logout', { session: s }); } catch(e){}
  showAuth('login');
}
function errText(r){
  switch(r && r.error){
    case 'WrongPin': return 'الرقم السري غلط' + (r.attemptsLeft != null ? ' — باقي ' + r.attemptsLeft + ' محاولات' : '');
    case 'WrongViewToken': return 'VIEW_TOKEN غلط' + (r.attemptsLeft != null ? ' — باقي ' + r.attemptsLeft + ' محاولات' : '');
    case 'Locked': return '🔒 مقفل ' + r.minutes + ' دقيقة بسبب محاولات غلط';
    case 'NoViewToken': return 'شغّل generateViewToken في السكربت أول';
    case 'BadPin': return 'الرقم السري لازم يكون 6 أرقام';
    case 'Unauthorized': case 'Empty message':
      return 'السكربت ما تحدّث — تأكد من سطر dash_ في code.gs وسوّ New version';
    case 'UsePost': case 'UnknownAction': case 'BadResponse':
      return '⏳ Google ما رد صح هالمرة — اسحب للتحديث بعد شوي (' + r.error + ')';
    default: return (r && r.error) ? '⚠️ ' + r.error : '⚠️ خطأ غير معروف';
  }
}
function digits(v){ return String(v || '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, ''); }

/* ---------- شاشات الدخول ---------- */

  }[mode];
  const needView = mode !== 'change';
  a.innerHTML = '<div class="lock">' + T[0] + '</div><h3>' + T[1] + '</h3><p>' + T[2] + '</p><div class="form">' +
    (needView
      ? '<label for="fView">VIEW_TOKEN</label><div class="field"><input id="fView" type="text" placeholder="view_…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="paste" id="fPaste">📋 لصق</button></div>' +
        '<div class="hint">ينحفظ مؤقتًا لو طلعت تنسخه وترجع.</div>'
      : '<label for="fCur">الرقم السري الحالي</label><input id="fCur" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off">') +
    '<label for="fPin">الرقم السري الجديد (6 أرقام)</label><input id="fPin" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">' +
    '<label for="fPin2">أعد كتابته</label><input id="fPin2" class="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">' +
    '</div><div class="msg" id="amsg">' + esc(note || '') + '</div><button class="btn" id="fGo">حفظ</button>' +
    (mode === 'setup' ? '' : '<button class="link" id="fBack">رجوع</button>');

function drawDots(){ const d = $('dots'); if(!d) return; d.querySelectorAll('i').forEach((el, i) => el.className = i < pinBuf.length ? 'f' : ''); }
async function padKey(k){
  if(pinBusy) return;
  if(k === 'clear') pinBuf = ''; else if(k === 'back') pinBuf = pinBuf.slice(0, -1); else if(pinBuf.length < 6) pinBuf += k;
  drawDots();
  if(pinBuf.length !== 6) return;
  pinBusy = true; $('amsg').className = 'msg'; $('amsg').textContent = '…';
  try {
    const r = await api('dash_login', { pin: pinBuf });
    if(r.ok){ LS.set('bsx:session', r.session); pinBusy = false; enterApp(); return; }
    pinBuf = ''; drawDots(); $('dots').classList.remove('shake'); void $('dots').offsetWidth; $('dots').classList.add('shake');
    $('amsg').textContent = errText(r);

  pinBusy = false;
}
function enterApp(){
  privateNow = !!prefs.privacy; applyPrivacy();
  $('auth').style.display = 'none'; $('prefs').style.display = 'none'; $('app').style.display = 'block'; $('month').style.visibility = ''; $('eye').style.visibility = ''; $('gear').style.visibility = ''; $('refresh').style.visibility = '';
  fromCache(); load(true);
}
async function boot(){
  ['bsx:api','bsx:key','bsx:draft:api','bsx:draft:key'].forEach(k => LS.del(k)); // من النسخ القديمة
  if(session()){ enterApp(); return; }
  if(!apiReady()){ showAuth('login'); return; }
  try { const r = await api('dash_status'); showAuth(r.ok && !r.pinSet ? 'setup' : 'login', r.ok ? '' : errText(r)); }
  catch(e){ showAuth('login', '📴 ما قدرت أتصل بالسكربت'); }
}

$('gear').onclick = () => { if(session()) openPrefs(); };
$('refresh').onclick = () => { if(session()) load(true); };
$('month').onchange = e => { state.month = e.target.value; fromCache(); load(true); };

/* ---------- جلب البيانات ---------- */
function cacheKey(m){ return 'bsx:data:' + (m || curMonthKey()); }
function fromCache(){
  if(!session()) return false;
  const raw = LS.get(cacheKey(state.month));
  if(raw){ try { state.data = JSON.parse(raw); render(); return true; } catch(e){} }
  return false;
}
async function load(force){
  if(!session() || state.loading) return;
  state.loading = true; $('refresh').classList.add('spin'); if($('fresh').style.display !== 'none'){ $('fresh').classList.add('loading'); $('fresh').lastChild.textContent = 'يحدّث…'; }
  try {
    const data = await api('dash_data', { session: session(), month: state.month || '' });
    if(!data.ok){
      if(data.error === 'SessionExpired'){ LS.del('bsx:session'); clearData(); showAuth('login', 'انتهت الجلسة — اكتب رقمك السري'); }
      else showBanner(errText(data));
    } else {
      showBanner('');
      state.data = data;
      if(!state.month) state.month = data.month;
      LS.set(cacheKey(data.month), JSON.stringify(data));
      render();
    }
  } catch(err){
    showBanner(state.data ? '📴 ما قدرت أحدّث — تعرض آخر بيانات محفوظة' : '📴 ما قدرت أتصل بالسكربت. تأكد من النت.');
  } finally {
    state.loading = false; $('refresh').classList.remove('spin');
  }
}

/* ---------- العرض ---------- */
function render(){
  const d = state.data; if(!d) return;
  const k = d.kpi, base = d.base === 'SAR' ? 'ر.س' : d.base;
  const prevName = monthName(d.trend[4].month);

  // قائمة الأشهر
  const sel = $('month');
  const months = d.months.indexOf(d.month) === -1 ? [d.month].concat(d.months) : d.months;
  sel.innerHTML = months.map(m => '<option value="' + m + '"' + (m === d.month ? ' selected' : '') + '>' + monthName(m) + '</option>').join('');

  const empty = '<div class="empty">ما فيه عمليات</div>';
  const B = {};

  B.hero = () => {
    let change = '<span class="pill flat">— ما فيه مقارنة</span>';
    if(k.changePct !== null){
      const cls = k.changePct > 0.5 ? 'up' : k.changePct < -0.5 ? 'down' : 'flat';
      const arrow = cls === 'up' ? '▲' : cls === 'down' ? '▼' : '●';
      change = '<span class="pill ' + cls + '">' + arrow + ' <span class="num">' + Math.abs(k.changePct).toFixed(1) + '%</span> عن ' + (k.samePeriod ? 'نفس الفترة من ' : '') + shortMonth(d.trend[4].month) + '</span>';
    }
    return '<section class="card hero"><div class="label">إجمالي مصروفات ' + monthName(d.month) + (d.isCurrent ? ' (حتى اليوم)' : '') + '</div>' +
      '<div class="big"><span class="num" id="heroTotal" data-v="' + k.total + '">' + money(k.total) + '</span><small>' + base + '</small></div>' + change +
      '<div class="meta"><span>🧾 <b class="num">' + k.count + '</b> عملية</span><span>📊 متوسط العملية <b class="num">' + money(k.average) + '</b></span></div>' +
      (k.prevTotal > 0 ? '<div class="mbar"><i style="width:' + pct(k.total, k.prevTotal) + '%"></i>' +
        (d.isCurrent ? '<b style="right:' + pct(d.elapsed, d.daysInMonth) + '%"></b>' : '') + '</div>' +
        '<div class="mtxt"><span>صرفت <span class="num">' + Math.round(k.total / k.prevTotal * 100) + '%</span> من إجمالي ' + shortMonth(d.trend[4].month) + '</span>' +
        (d.isCurrent ? '<span>مضى <span class="num">' + Math.round(d.elapsed / d.daysInMonth * 100) + '%</span> من الشهر</span>' : '') + '</div>' : '') +
      '</section>';
  };

  B.alerts = () => {
    const al = [];
    if(k.transfersPending) al.push('🔁 ' + k.transfersPending + ' حوالة تنتظر تحديد الغرض في Transfers');
    if(k.merchantsReview) al.push('🏪 ' + k.merchantsReview + ' تاجر يحتاج مراجعة في Merchants');
    if(k.unclassified) al.push('❓ ' + k.unclassified + ' عملية غير مصنفة هالشهر');
    if(k.otherCurrency) al.push('🌍 ' + k.otherCurrency + ' عملية بعملة غير ' + d.base + ' (ما تدخل الإجمالي)');
    return al.length ? '<div class="alerts">' + al.map(a => '<div class="alert">' + esc(a) + '</div>').join('') + '</div>' : '';
  };

  B.kpis = () => {
    const activeDays = d.daily.slice(0, d.elapsed).filter(v => v > 0).length;
    const topCat = d.categories[0], topM = d.merchants[0];
    const C = {
      daily: () => kpi('📆 المتوسط اليومي', money(k.dailyAverage), 'على ' + d.elapsed + ' يوم'),
      forecast: () => kpi('🔮 توقع نهاية الشهر', k.forecast !== null ? money(k.forecast) : '—', k.forecast !== null ? 'بنفس معدل الصرف' : 'الشهر خلص'),
      largest: () => kpi('🏆 أكبر عملية', k.largest ? money(k.largest.amount) : '—', k.largest ? k.largest.merchant : ''),
      prev: () => kpi('⏮️ ' + prevName, money(k.prevTotal), k.samePeriod ? 'لنفس الفترة: ' + money(k.prevSamePeriod) : 'الشهر كامل'),
      topcat: () => kpi('🥇 أعلى تصنيف', topCat ? money(topCat.amount) : '—', topCat ? topCat.name : ''),
      topmerchant: () => kpi('🏪 أكثر تاجر', topM ? money(topM.amount) : '—', topM ? topM.name + ' · ' + topM.count + ' عملية' : ''),
      activeDays: () => kpi('🗓️ أيام الصرف', activeDays + ' / ' + d.elapsed, (d.elapsed - activeDays) + ' يوم بدون صرف'),
      avgActive: () => kpi('💳 متوسط يوم الصرف', activeDays ? money(k.total / activeDays) : '—', 'على ' + activeDays + ' يوم فيه صرف')
    };
    const cards = prefs.kpis.filter(id => C[id]).map(id => C[id]()).join('');
    return cards ? '<div class="grid">' + cards + '</div>' : '';
  };

  B.trend = () => {
    const tmax = Math.max.apply(null, d.trend.map(t => t.amount).concat([1]));
    return '<section class="card trend"><h2>آخر 6 أشهر</h2><div class="cols">' + d.trend.map(t =>
      '<div class="col' + (t.month === d.month ? ' on' : '') + '" data-m="' + t.month + '"><div class="v num">' + (t.amount ? money(t.amount / 1000, 1) + 'k' : '') + '</div>' +
      '<div class="b" style="height:' + pct(t.amount, tmax) + '%"></div><div class="t">' + shortMonth(t.month) + '</div></div>').join('') + '</div></section>';
  };

  B.daily = () => {
    const dmax = Math.max.apply(null, d.daily.concat([1]));
    const today = d.isCurrent ? d.elapsed : -1;
    const vivid = prefs.design === 'vivid';
    return '<section class="card daily"><h2>الصرف اليومي <span class="num" style="font-weight:500">أعلى يوم: ' + money(dmax, 0) + '</span></h2>' +
      '<div class="dtip" id="dtip">اضغط على أي يوم يطلع لك مبلغه</div><div class="cols">' + d.daily.map((v, i) =>
      '<div class="col' + (i + 1 === today ? ' today' : (v > 0 ? ' on' : (today > 0 && i + 1 > today ? ' future' : ''))) + '" data-i="' + i + '"><div class="b" style="height:' + pct(Math.max(v, 0), dmax) + '%' + (vivid && v > 0 ? ';background:' + (i + 1 === today ? '#2563eb' : '#60a5fa') : '') + '"></div>' +
      '<div class="t num">' + ((i + 1) % 5 === 1 || i + 1 === today ? (i + 1) : '') + '</div></div>').join('') + '</div></section>';
  };

  B.race = () => {
    if(!d.prevDaily) return '<section class="card"><h2>🏁 سباق الشهر</h2><div class="empty">حدّث Api.gs في السكربت عشان يظهر السباق</div></section>';
    const cum = a => { let s = 0; return a.map(v => (s += v)); };
    const cur = cum(d.daily).slice(0, d.elapsed), prev = cum(d.prevDaily);
    const W = 340, H = 150, n = Math.max(d.daily.length, d.prevDaily.length) - 1;
    const max = Math.max.apply(null, prev.concat(cur).concat([1]));
    const X = i => (W - 6 - (i / n) * (W - 12)).toFixed(1), Y = v => (H - 6 - Math.max(v, 0) / max * (H - 14)).toFixed(1);
    const line = a => a.map((v, i) => X(i) + ',' + Y(v)).join(' ');
    const lastI = cur.length - 1, curV = cur[lastI] || 0, prevV = prev[Math.min(lastI, prev.length - 1)] || 0;
    const diff = curV - prevV;
    const color = prefs.design === 'vivid' ? '#f97316' : 'var(--accent)';
    const prevName = shortMonth(d.trend[4].month), curName = shortMonth(d.month);
    const head = diff <= 0 ? '<span class="ahead" style="color:var(--down)">أقل بـ <span class="num">' + money(-diff, 0) + '</span></span>'
                           : '<span class="ahead" style="color:var(--up)">أكثر بـ <span class="num">' + money(diff, 0) + '</span></span>';
    return '<section class="card race"><h2>🏁 سباق الشهر ' + head + '</h2>' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<polyline points="' + line(prev) + '" fill="none" stroke="var(--faint)" stroke-width="2.2" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>' +
      (cur.length ? '<polygon points="' + line(cur) + ' ' + X(lastI) + ',' + (H - 6) + ' ' + X(0) + ',' + (H - 6) + '" fill="' + color + '" opacity=".13"/>' +
        '<polyline points="' + line(cur) + '" fill="none" stroke="' + color + '" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
        '<circle cx="' + X(lastI) + '" cy="' + Y(curV) + '" r="4.5" fill="' + color + '"/>' : '') +
      '</svg><div class="axis"><span>1</span><span>' + Math.ceil((n + 1) / 2) + '</span><span>' + (n + 1) + '</span></div><div class="leg"><span><i style="background:' + color + '"></i>' + curName + ' <span class="num">' + money(curV, 0) + '</span></span>' +
      '<span><i style="background:var(--faint)"></i>' + prevName + ' لنفس اليوم <span class="num">' + money(prevV, 0) + '</span></span></div></section>';
  };

  B.categories = () => {
    const vivid = prefs.design === 'vivid';
    let donut = '';
    if(vivid && d.categories.length){
      const list = d.categories.filter(c => c.amount > 0), tot = list.reduce((a, c) => a + c.amount, 0) || 1;
      const R = 62, C = 2 * Math.PI * R; let acc = 0;
      const arcs = list.map(c => { const len = c.amount / tot * C; const a = '<circle r="' + R + '" cx="80" cy="80" fill="none" stroke="' + catColor(c.name) + '" stroke-width="24" stroke-dasharray="' + Math.max(len - 1.5, 0.5) + ' ' + C + '" stroke-dashoffset="' + (-acc) + '" transform="rotate(-90 80 80)"/>'; acc += len; return a; }).join('');
      donut = '<div class="donut"><svg width="140" height="140" viewBox="0 0 160 160">' + arcs +
        '<text x="80" y="76" text-anchor="middle" font-size="12" fill="var(--sub)">' + list.length + ' تصنيفات</text>' +
        '<text x="80" y="96" text-anchor="middle" font-size="17" font-weight="800" fill="var(--ink)">' + money(tot, 0) + '</text></svg>' +
        '<div class="lgd">' + list.slice(0, 6).map(c => '<div><i style="background:' + catColor(c.name) + '"></i><span>' + esc(c.name) + '</span><b class="num">' + Math.round(c.amount / tot * 100) + '%</b></div>').join('') + '</div></div>';
    }
    return '<section class="card"><h2>التصنيفات</h2>' + donut + '<div class="list">' + (d.categories.length ? lim(d.categories).map(c => {
    let ch = '';
    if(c.prev > 0){ const p = (c.amount - c.prev) / c.prev * 100; ch = '<span class="chg ' + (p > 0 ? 'up' : 'down') + '"><span class="num">' + (p > 0 ? '+' : '') + p.toFixed(0) + '%</span>' + (k.samePeriod ? ' عن نفس الفترة' : ' عن الشهر السابق') + '</span>'; }
    else if(c.amount > 0) ch = '<span>جديد هالشهر</span>';
    return '<div class="item"><div class="r1"><span class="n">' + esc(c.name) + '</span><span class="a num">' + money(c.amount) + '</span></div>' +
      '<div class="track"><i style="width:' + pct(c.amount, k.total) + '%' + (vivid ? ';background:' + catColor(c.name) : '') + '"></i></div>' +
      '<div class="r2"><span><span class="num">' + pct(c.amount, k.total).toFixed(1) + '%</span> · ' + c.count + ' عملية</span>' + ch + '</div></div>';
  }).join('') : empty) + '</div></section>';
  };

  B.merchants = () => {
    const mmax = d.merchants.length ? d.merchants[0].amount : 1;
    return '<section class="card"><h2>أكثر التجار صرفًا</h2><div class="list">' + (d.merchants.length ? lim(d.merchants).map(m =>
      '<div class="item"><div class="r1"><span class="n">' + esc(m.name) + '</span><span class="a num">' + money(m.amount) + '</span></div>' +
      '<div class="track"><i style="width:' + pct(m.amount, mmax) + '%"></i></div>' +
      '<div class="r2"><span>' + m.count + ' عملية</span></div></div>').join('') : empty) + '</div></section>';
  };

  B.groups = () => {
    const g = state.tabs.group, glist = d[g] || [];
    return '<section class="card"><h2>التوزيع<div class="tabs" data-tabs="group">' +
      tab('group','banks','البنك') + tab('group','payments','الدفع') + tab('group','types','النوع') + '</div></h2><div class="list">' +
      (glist.length ? lim(glist).map(x => '<div class="item"><div class="r1"><span class="n">' + esc(x.name) + '</span><span class="a num">' + money(x.amount) + '</span></div>' +
        '<div class="track"><i style="width:' + pct(x.amount, k.total) + '%"></i></div><div class="r2"><span><span class="num">' + pct(x.amount, k.total).toFixed(1) + '%</span> · ' + x.count + ' عملية</span></div></div>').join('')
        : empty) + '</div></section>';
  };

  B.weekday = () => {
    const wmax = Math.max.apply(null, d.weekday.concat([1]));
    const mi = d.weekday.indexOf(wmax);
    return '<section class="card week"><h2>أيام الأسبوع <span style="font-weight:500">الأعلى: ' + (wmax > 1 ? WEEK[mi] : '—') + '</span></h2><div class="cols">' + d.weekday.map((v, i) =>
      '<div class="col on' + (i === mi && wmax > 1 ? ' max' : '') + '"><div class="v num">' + (v > 0 ? (v >= 1000 ? money(v / 1000, 1) + 'k' : money(v, 0)) : '') + '</div><div class="b" style="height:' + pct(Math.max(v,0), wmax) + '%"></div><div class="t">' + WEEK[i] + '</div></div>').join('') + '</div></section>';
  };

  B.insights = () => {
    const out = [];
    const prevName = shortMonth(d.trend[4].month);
    // 1) المعدل وتوقع نهاية الشهر
    if(d.isCurrent && k.forecast && k.prevTotal){
      const p = (k.forecast - k.prevTotal) / k.prevTotal * 100;
      out.push(['🔮', 'بنفس معدلك الحالي بتنهي الشهر على <b class="num">' + money(k.forecast, 0) + '</b>، ' +
        (p >= 0 ? '<b style="color:var(--up)">أعلى</b>' : '<b style="color:var(--down)">أقل</b>') + ' من ' + prevName + ' بـ <b class="num">' + Math.abs(p).toFixed(0) + '%</b>']);
    }
    // 2) أكبر ارتفاع وأكبر انخفاض بالتصنيفات
    const ch = d.categories.filter(c => c.prev > 0 && Math.abs(c.amount - c.prev) >= 100).map(c => ({ c: c, diff: c.amount - c.prev, p: (c.amount - c.prev) / c.prev * 100 }));
    const up = ch.slice().sort((a, b) => b.diff - a.diff)[0], dn = ch.slice().sort((a, b) => a.diff - b.diff)[0];
    if(up && up.diff > 0) out.push(['📈', esc(up.c.name) + ' زاد <b class="num">' + money(up.diff, 0) + '</b> (<span class="num">+' + up.p.toFixed(0) + '%</span>) عن ' + (k.samePeriod ? 'نفس الفترة' : prevName)]);
    if(dn && dn.diff < 0) out.push(['📉', esc(dn.c.name) + ' نزل <b class="num">' + money(-dn.diff, 0) + '</b> (<span class="num">' + dn.p.toFixed(0) + '%</span>) 👏']);
    // 3) عملية وحدة كبيرة
    if(k.largest && k.total > 0 && k.largest.amount / k.total >= 0.25){
      out.push(['🏆', 'عملية وحدة (' + esc(k.largest.merchant) + ') تمثل <b class="num">' + Math.round(k.largest.amount / k.total * 100) + '%</b> من مصروف الشهر']);
    }
    // 4) أكثر تاجر تكرارًا
    const freq = d.merchants.slice().sort((a, b) => b.count - a.count)[0];
    if(freq && freq.count >= 3) out.push(['🔁', 'أكثر مكان تكرر: <b>' + esc(freq.name) + '</b> — <span class="num">' + freq.count + '</span> مرات بمجموع <b class="num">' + money(freq.amount, 0) + '</b>']);
    // 5) أيام بدون صرف + أعلى يوم بالأسبوع
    const active = d.daily.slice(0, d.elapsed).filter(v => v > 0).length, none = d.elapsed - active;
    if(none > 0) out.push(['🌿', '<b class="num">' + none + '</b> ' + (none === 1 ? 'يوم' : none === 2 ? 'يومين' : 'أيام') + ' بدون أي صرف من ' + d.elapsed]);
    const wm = Math.max.apply(null, d.weekday);
    if(wm > 0) out.push(['🗓️', 'أكثر يوم تصرف فيه: <b>' + ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'][d.weekday.indexOf(wm)] + '</b>']);
    if(!out.length) return '';
    return '<section class="card"><h2>💡 ملاحظات الشهر</h2>' + out.slice(0, 6).map(x => '<div class="ins"><span class="ic">' + x[0] + '</span><span>' + x[1] + '</span></div>').join('') + '</section>';
  };

  B.tx = () => {
    const t = state.tabs.tx, tlist = d[t] || [];
    return '<section class="card tx"><h2>العمليات<div class="tabs" data-tabs="tx">' + tab('tx','recent','الأحدث') + tab('tx','top','الأكبر') + '</div></h2><div class="list">' +
      (tlist.length ? lim(tlist).map((x, xi) => '<div class="item" data-tx="' + t + ':' + xi + '"><div class="r1"><span class="n"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + catColor(x.category) + ';margin-inline-end:7px;vertical-align:middle"></i>' + esc(x.merchant) + '</span><span class="a num"' + (x.amount < 0 ? ' style="color:var(--down)"' : '') + '>' + money(x.amount) + (x.currency !== d.base ? ' ' + esc(x.currency) : '') + '</span></div>' +
        '<div class="r2"><span>' + esc(x.category) + '</span><span>' + dayLabel(x.day) + (x.time ? ' · <span class="num">' + esc(x.time) + '</span>' : '') + '</span></div>' +
        '<div class="r2"><span>' + esc(x.bank) + ' · ' + esc(x.payment) + '</span></div></div>').join('') : empty) + '</div></section>';
  };

  const h = prefs.order.filter(id => !prefs.hidden[id] && B[id]).map(id => B[id]()).join('');
  $('app').innerHTML = h || '<div class="card empty">كل الأقسام مخفية — افتح ⚙️ وفعّل اللي تبيه</div>';
  $('updated').textContent = 'آخر تحديث من الشيت: ' + d.generatedAt;
  freshness();

  // تفاعل
  document.querySelectorAll('[data-tx]').forEach(el => el.onclick = () => {
    const parts = el.dataset.tx.split(':'); const x = (d[parts[0]] || [])[Number(parts[1])];
    if(x) openSheet(x, d);
  });
  countUp();
  document.querySelectorAll('.trend .col').forEach(el => el.onclick = () => {
    state.month = el.dataset.m;
    fromCache();
    load(true);
  });
  document.querySelectorAll('.daily .col').forEach(el => el.onclick = () => {
    const i = Number(el.dataset.i), v = d.daily[i] || 0, c = d.dailyCount ? d.dailyCount[i] : null;
    document.querySelectorAll('.daily .col.sel').forEach(x => x.classList.remove('sel')); el.classList.add('sel');
    $('dtip').innerHTML = (i + 1) + ' ' + shortMonth(d.month) + ' · <b class="num">' + money(v) + '</b> ' + (d.base === 'SAR' ? 'ر.س' : esc(d.base)) + (c !== null ? ' · ' + (c === 1 ? 'عملية وحدة' : c === 2 ? 'عمليتين' : c + (c <= 10 ? ' عمليات' : ' عملية')) : '');
  });
  document.querySelectorAll('[data-tabs] button').forEach(b => b.onclick = () => {
    state.tabs[b.parentNode.dataset.tabs] = b.dataset.v; render();
  });
}
/* لون ثابت لكل تصنيف (التصميم الملوّن) */
const CAT_COLORS = [
  [/منزل/, '#3b82f6'], [/مطاعم|مقاهي/, '#f97316'], [/بقالة|تموينات/, '#22c55e'], [/تسوق/, '#a855f7'],
  [/عناية/, '#ec4899'], [/صحة/, '#ef4444'], [/وقود/, '#eab308'], [/سيارات/, '#64748b'], [/اتصالات/, '#06b6d4'],
  [/تحويلات/, '#14b8a6'], [/سفر/, '#0ea5e9'], [/ترفيه/, '#8b5cf6'], [/تعليم/, '#6366f1'], [/اشتراكات/, '#d946ef'],
  [/تبرعات/, '#10b981'], [/عائلة/, '#f43f5e'], [/ملابس/, '#c026d3'], [/مالية/, '#0d9488'], [/أخرى|اخرى/, '#94a3b8'], [/غير\s*مصنف/, '#9ca3af']
];
const SPARE = ['#2563eb','#ea580c','#16a34a','#9333ea','#db2777','#ca8a04','#0891b2','#4f46e5'];
function catColor(name){
  for(let i = 0; i < CAT_COLORS.length; i++) if(CAT_COLORS[i][0].test(name)) return CAT_COLORS[i][1];
  let h = 0; for(const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return SPARE[h % SPARE.length];
}
/* ---------- تفاصيل عملية ---------- */
function openSheet(x, d){
  const same = (d.recent || []).concat(d.top || []).filter((y, i, a) => y.merchant === x.merchant && a.findIndex(z => z.day === y.day && z.time === y.time && z.amount === y.amount) === i);
  const total = same.reduce((a, y) => a + y.amount, 0);
  const days = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const dt = new Date(Number(x.day.slice(0,4)), Number(x.day.slice(5,7)) - 1, Number(x.day.slice(8,10)));
  $('sheetBody').innerHTML = '<div class="grab"></div>' +
    '<div class="amt num"' + (x.amount < 0 ? ' style="color:var(--down)"' : '') + '>' + money(x.amount) + ' <small style="font-size:15px;color:var(--sub)">' + (x.currency === 'SAR' ? 'ر.س' : esc(x.currency)) + '</small></div>' +
    '<div class="who">' + esc(x.merchant) + '</div>' +
    '<div class="cat"><span style="background:' + catColor(x.category) + '">' + esc(x.category) + '</span></div>' +
    '<div class="kv"><span>التاريخ</span><span>' + days[dt.getDay()] + ' ' + dayLabel(x.day) + '</span></div>' +
    (x.time ? '<div class="kv"><span>الوقت</span><span class="num">' + esc(x.time) + '</span></div>' : '') +
    '<div class="kv"><span>البنك</span><span>' + esc(x.bank) + '</span></div>' +
    '<div class="kv"><span>طريقة الدفع</span><span>' + esc(x.payment) + '</span></div>' +
    (same.length > 1 ? '<div class="sim">ظهر هالتاجر <span class="num">' + same.length + '</span> مرات في القائمة بمجموع <span class="num">' + money(total) + '</span></div>' : '');
  const sh = $('sheet'); sh.style.display = 'block'; requestAnimationFrame(() => sh.classList.add('on'));
}
function closeSheet(){ const sh = $('sheet'); sh.classList.remove('on'); setTimeout(() => { sh.style.display = 'none'; }, 250); }
$('sheet').querySelector('.bk').onclick = closeSheet;
(function(){ let y0 = null; const pn = $('sheetBody');
  pn.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; }, { passive: true });
  pn.addEventListener('touchend', e => { if(y0 !== null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0 = null; });
  pn.onclick = e => { if(e.target.classList.contains('grab')) closeSheet(); };
})();

/* ---------- عدّاد الإجمالي (مرة وحدة لكل شهر) ---------- */
let countedFor = '';
function countUp(){
  const el = $('heroTotal'); if(!el || !state.data) return;
  const key = state.data.month + ':' + state.data.kpi.total;
  if(countedFor === key) return; countedFor = key;
  const to = Number(el.dataset.v) || 0, t0 = performance.now(), dur = 700;
  (function step(t){
    const f = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - f, 3);
    el.textContent = money(to * e);
    if(f < 1) requestAnimationFrame(step); else el.textContent = money(to);
  })(t0);
}

function kpi(l, v, s){ return '<div class="kpi"><div class="l">' + l + '</div><div class="v num">' + v + '</div><div class="s">' + esc(s || '') + '</div></div>'; }
function tab(group, v, label){ return '<button data-v="' + v + '" class="' + (state.tabs[group] === v ? 'on' : '') + '">' + label + '</button>'; }

/* ---------- حداثة البيانات ---------- */
function freshness(){
  const el = $('fresh'), d = state.data;
  if(!d || !d.generatedAt || $('app').style.display === 'none'){ el.style.display = 'none'; return; }
  const t = new Date(d.generatedAt.replace(' ', 'T') + ':00+03:00').getTime();
  const min = Math.max(0, Math.round((Date.now() - t) / 60000));
  const h = Math.round(min / 60), dd = Math.round(min / 1440);
  const txt = min < 1 ? 'محدّث الحين' : min < 60 ? 'محدّث قبل ' + (min === 1 ? 'دقيقة' : min === 2 ? 'دقيقتين' : min + ' دقيقة') : min < 1440 ? 'محدّث قبل ' + (h === 1 ? 'ساعة' : h === 2 ? 'ساعتين' : h + ' ساعات') : 'محدّث قبل ' + (dd === 1 ? 'يوم' : dd === 2 ? 'يومين' : dd + ' أيام');
  el.className = 'fresh' + (min > 30 ? ' old' : ''); el.innerHTML = '<i></i>' + txt; el.style.display = 'flex';
}
setInterval(freshness, 30000);

/* ---------- إخفاء المبالغ ---------- */
let privateNow = !!prefs.privacy;
function applyPrivacy(){ document.body.classList.toggle('private', privateNow); $('eye').style.opacity = privateNow ? '.5' : '1'; }
$('eye').onclick = () => { privateNow = !privateNow; applyPrivacy(); };
applyPrivacy();

/* ---------- سحب للتحديث ---------- */
(function(){
  let y0 = null, dist = 0;
  const ptr = $('ptr');
  window.addEventListener('touchstart', e => { y0 = (window.scrollY <= 0 && session() && $('app').style.display !== 'none') ? e.touches[0].clientY : null; dist = 0; }, { passive: true });
  window.addEventListener('touchmove', e => {
    if(y0 === null) return;
    dist = Math.max(0, e.touches[0].clientY - y0);
    ptr.classList.add('go'); ptr.style.height = Math.min(60, dist / 2.2) + 'px';
    ptr.textContent = dist > 120 ? '↻ اترك للتحديث' : '↓ اسحب للتحديث';
  }, { passive: true });
  window.addEventListener('touchend', () => {
    if(y0 === null) return;
    ptr.classList.remove('go'); ptr.style.height = '0px';
    if(dist > 120) load(true);
    y0 = null; dist = 0;
  });
})();

/* ---------- تشغيل ---------- */
$('ver').textContent = VERSION;
boot();
setInterval(() => { if(document.visibilityState === 'visible') load(false); }, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') load(false); });
</script>
